<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <style>
    text { font-family: 'SF Mono', 'Cascadia Code', 'Consolas', 'Courier New', 'Microsoft JhengHei', 'Microsoft YaHei', monospace; fill: #e2e8f0; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="mb" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/></marker>
    <marker id="mo" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f97316"/></marker>
    <marker id="mg" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#10b981"/></marker>
    <marker id="my" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eab308"/></marker>
    <marker id="ms" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#64748b"/></marker>
    <marker id="mp" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a855f7"/></marker>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Title -->
  <text x="430" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#e2e8f0">CA — 模組訊號流 Module Signal Flow</text>
  <text x="430" y="68" text-anchor="middle" font-size="12" fill="#94a3b8">Conformer Accelerator · op ∈ {FFN, Conv, SHA, MHA}</text>

  <!-- Legend (top-right) -->
  <rect x="946" y="28" width="300" height="78" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <line x1="958" y1="46" x2="984" y2="46" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#mb)"/>
  <text x="990" y="50" font-size="10.5" fill="#94a3b8">data bus</text>
  <line x1="958" y1="68" x2="984" y2="68" stroke="#f97316" stroke-width="1.8" marker-end="url(#mo)"/>
  <text x="990" y="72" font-size="10.5" fill="#94a3b8">control / cmd</text>
  <line x1="958" y1="90" x2="984" y2="90" stroke="#eab308" stroke-width="1.8" marker-end="url(#my)"/>
  <text x="990" y="94" font-size="10.5" fill="#94a3b8">result feedback</text>
  <line x1="1100" y1="46" x2="1126" y2="46" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#ms)"/>
  <text x="1132" y="50" font-size="10.5" fill="#94a3b8">handshake</text>
  <line x1="1100" y1="68" x2="1126" y2="68" stroke="#10b981" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#mg)"/>
  <text x="1132" y="72" font-size="10.5" fill="#94a3b8">write-back</text>
  <line x1="1100" y1="90" x2="1126" y2="90" stroke="#a855f7" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#mp)"/>
  <text x="1132" y="94" font-size="10.5" fill="#94a3b8">norm_data</text>

  <!-- ================= EDGES ================= -->
  <!-- PATTERN -> Control -->
  <path d="M 200,210 L 250,210" stroke="#f97316" stroke-width="1.7" fill="none" marker-end="url(#mo)"/>
  <text x="225" y="202" text-anchor="middle" font-size="9" fill="#fb923c">op·act·param</text>
  <!-- Control -> DataPath (issue) -->
  <path d="M 520,180 L 580,180" stroke="#f97316" stroke-width="1.7" fill="none" marker-end="url(#mo)"/>
  <text x="550" y="172" text-anchor="middle" font-size="9" fill="#fb923c">issue·mode + exec_*</text>
  <!-- DataPath -> Control (result feedback) -->
  <path d="M 580,232 L 520,232" stroke="#eab308" stroke-width="1.7" fill="none" marker-end="url(#my)"/>
  <text x="550" y="225" text-anchor="middle" font-size="9" fill="#eab308">result_valid</text>
  <!-- Control -> RAM (cmd) -->
  <path d="M 358,360 L 358,410" stroke="#f97316" stroke-width="1.7" fill="none" marker-end="url(#mo)"/>
  <text x="350" y="392" text-anchor="end" font-size="9" fill="#fb923c">en·addr·burst</text>
  <!-- RAM -> Control (handshake) -->
  <path d="M 412,410 L 412,362" stroke="#64748b" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#ms)"/>
  <text x="420" y="392" font-size="9" fill="#94a3b8">ready·valid</text>
  <!-- RAM -> DataPath (rd_data) -->
  <path d="M 470,455 L 600,455" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#mb)"/>
  <text x="528" y="448" text-anchor="middle" font-size="9.5" fill="#60a5fa">rd_data[255:0]</text>
  <!-- DataPath -> RAM (wr_data) -->
  <path d="M 1169,480 L 1169,650 L 385,650 L 385,587" stroke="#10b981" stroke-width="1.9" fill="none" stroke-dasharray="6,4" marker-end="url(#mg)"/>
  <text x="770" y="644" text-anchor="middle" font-size="9.5" fill="#34d399">wr_data[255:0]  (wr_valid)</text>
  <!-- DataPath -> PATTERN (out) -->
  <path d="M 1204,480 L 1204,682 L 120,682 L 120,570" stroke="#3b82f6" stroke-width="1.9" fill="none" marker-end="url(#mb)"/>
  <text x="690" y="676" text-anchor="middle" font-size="9.5" fill="#60a5fa">out_valid · out_data[31:0]  (last token)</text>

  <!-- Internal datapath arrows -->
  <path d="M 720,390 L 734,390" stroke="#3b82f6" stroke-width="1.8" fill="none" marker-end="url(#mb)"/>
  <text x="727" y="382" text-anchor="middle" font-size="8.5" fill="#60a5fa">q·k·v</text>
  <path d="M 854,390 L 868,390" stroke="#3b82f6" stroke-width="1.8" fill="none" marker-end="url(#mb)"/>
  <text x="861" y="382" text-anchor="middle" font-size="8.5" fill="#60a5fa">score</text>
  <path d="M 984,390 L 1000,390" stroke="#3b82f6" stroke-width="1.8" fill="none" marker-end="url(#mb)"/>
  <text x="992" y="382" text-anchor="middle" font-size="8.5" fill="#60a5fa">ctx</text>
  <path d="M 1100,390 L 1114,390" stroke="#3b82f6" stroke-width="1.8" fill="none" marker-end="url(#mb)"/>
  <text x="1107" y="382" text-anchor="middle" font-size="8.5" fill="#60a5fa">act</text>
  <!-- norm_data tap (shared MAC) QKV -> ACT -->
  <path d="M 660,480 L 660,516 L 1050,516 L 1050,480" stroke="#a855f7" stroke-width="1.7" fill="none" stroke-dasharray="5,3" marker-end="url(#mp)"/>
  <text x="852" y="510" text-anchor="middle" font-size="9.5" fill="#c084fc">norm_data  (FFN / Conv  y = W·x)</text>

  <!-- ================= NODES ================= -->
  <!-- PATTERN -->
  <rect x="40" y="150" width="160" height="420" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="120" y="184" text-anchor="middle" font-size="16" font-weight="700" fill="#93c5fd">PATTERN</text>
  <text x="120" y="206" text-anchor="middle" font-size="11" fill="#94a3b8">Testbench / host</text>

  <!-- CA_Control -->
  <rect x="250" y="110" width="270" height="250" rx="6" fill="#1c1917" stroke="#f97316" stroke-width="1.5"/>
  <text x="262" y="134" font-size="14" font-weight="700" fill="#fdba74">CA_Control</text>
  <text x="262" y="153" font-size="10.5" fill="#94a3b8">FSM + RAM 排程</text>
  <!-- FSM pills row1 -->
  <rect x="262" y="176" width="52" height="22" rx="11" fill="#44403c" stroke="#78716c" stroke-width="1"/>
  <text x="288" y="191" text-anchor="middle" font-size="10" fill="#fed7aa">IDLE</text>
  <path d="M 316,187 L 328,187" stroke="#78716c" stroke-width="1.2" fill="none" marker-end="url(#ms)"/>
  <rect x="330" y="176" width="96" height="22" rx="11" fill="#44403c" stroke="#78716c" stroke-width="1"/>
  <text x="378" y="191" text-anchor="middle" font-size="10" fill="#fed7aa">FAST_RUN</text>
  <text x="500" y="191" text-anchor="end" font-size="9" fill="#64748b">FFN/Conv</text>
  <!-- FSM pills row2 -->
  <rect x="262" y="210" width="98" height="22" rx="11" fill="#44403c" stroke="#78716c" stroke-width="1"/>
  <text x="311" y="225" text-anchor="middle" font-size="9.5" fill="#fed7aa">ATT_PARAM</text>
  <path d="M 362,221 L 372,221" stroke="#78716c" stroke-width="1.2" fill="none" marker-end="url(#ms)"/>
  <rect x="374" y="210" width="52" height="22" rx="11" fill="#44403c" stroke="#78716c" stroke-width="1"/>
  <text x="400" y="225" text-anchor="middle" font-size="9.5" fill="#fed7aa">READ</text>
  <path d="M 428,221 L 438,221" stroke="#78716c" stroke-width="1.2" fill="none" marker-end="url(#ms)"/>
  <rect x="440" y="210" width="52" height="22" rx="11" fill="#44403c" stroke="#78716c" stroke-width="1"/>
  <text x="466" y="225" text-anchor="middle" font-size="9.5" fill="#fed7aa">WAIT</text>
  <text x="262" y="262" font-size="9.5" fill="#64748b">▸ issue + 完成追蹤（FAST/ATT 共用 writeback）</text>

  <!-- RAM cylinder -->
  <rect x="300" y="410" width="170" height="155" fill="#052e16" stroke="none"/>
  <line x1="300" y1="410" x2="300" y2="565" stroke="#10b981" stroke-width="1.5"/>
  <line x1="470" y1="410" x2="470" y2="565" stroke="#10b981" stroke-width="1.5"/>
  <ellipse cx="385" cy="565" rx="85" ry="20" fill="#052e16" stroke="#10b981" stroke-width="1.5"/>
  <ellipse cx="385" cy="410" rx="85" ry="20" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="385" y="462" text-anchor="middle" font-size="16" font-weight="700" fill="#6ee7b7">RAM</text>
  <text x="385" y="484" text-anchor="middle" font-size="10.5" fill="#94a3b8">256 × (8×8, 4b)</text>
  <text x="385" y="502" text-anchor="middle" font-size="9.5" fill="#64748b">burst 128 · neg-edge</text>

  <!-- CA_DataPath -->
  <rect x="580" y="110" width="660" height="500" rx="8" fill="#14101f" stroke="#a855f7" stroke-width="1.5"/>
  <text x="596" y="136" font-size="14" font-weight="700" fill="#c4b5fd">CA_DataPath</text>
  <text x="596" y="155" font-size="10.5" fill="#94a3b8">compute → activation → PoT</text>

  <!-- ATT_Stream_Core group -->
  <rect x="590" y="250" width="400" height="300" rx="6" fill="#1a1530" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="602" y="272" font-size="12" font-weight="700" fill="#c4b5fd">ATT_Stream_Core</text>

  <!-- QKV -->
  <rect x="600" y="300" width="120" height="180" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.4"/>
  <text x="660" y="326" text-anchor="middle" font-size="12" font-weight="700" fill="#c7d2fe">QKV</text>
  <text x="660" y="345" text-anchor="middle" font-size="9.5" fill="#a5b4fc">Proj + Quant</text>
  <text x="660" y="372" text-anchor="middle" font-size="9.5" fill="#94a3b8">Q = X·Wq</text>
  <text x="660" y="388" text-anchor="middle" font-size="9.5" fill="#94a3b8">K = X·Wk</text>
  <text x="660" y="404" text-anchor="middle" font-size="9.5" fill="#94a3b8">V = X·Wv</text>
  <text x="660" y="430" text-anchor="middle" font-size="9" fill="#64748b">→ 4-bit</text>

  <!-- Score -->
  <rect x="734" y="300" width="120" height="180" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.4"/>
  <text x="794" y="326" text-anchor="middle" font-size="12" font-weight="700" fill="#c7d2fe">Score 8-Tap</text>
  <text x="794" y="358" text-anchor="middle" font-size="12" fill="#a5b4fc">Q · Kᵀ</text>
  <text x="794" y="388" text-anchor="middle" font-size="9.5" fill="#94a3b8">SHA / MHA</text>
  <text x="794" y="408" text-anchor="middle" font-size="9" fill="#64748b">col 切半 ×2</text>

  <!-- Final -->
  <rect x="868" y="300" width="116" height="180" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.4"/>
  <text x="926" y="326" text-anchor="middle" font-size="12" font-weight="700" fill="#c7d2fe">Final Acc</text>
  <text x="926" y="358" text-anchor="middle" font-size="12" fill="#a5b4fc">act(s) · V</text>
  <text x="926" y="386" text-anchor="middle" font-size="9.5" fill="#94a3b8">Booth</text>

  <!-- ACT -->
  <rect x="1000" y="300" width="100" height="180" rx="6" fill="#1c1917" stroke="#f97316" stroke-width="1.4"/>
  <text x="1050" y="326" text-anchor="middle" font-size="12" font-weight="700" fill="#fdba74">ACT</text>
  <text x="1050" y="352" text-anchor="middle" font-size="9.5" fill="#94a3b8">ReLU / RAT</text>
  <text x="1050" y="368" text-anchor="middle" font-size="9.5" fill="#94a3b8">CAT / BAT</text>
  <text x="1050" y="392" text-anchor="middle" font-size="9" fill="#64748b">5-stage</text>

  <!-- PoT -->
  <rect x="1114" y="300" width="110" height="180" rx="6" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.4"/>
  <text x="1169" y="326" text-anchor="middle" font-size="12" font-weight="700" fill="#d8b4fe">PoT Quant</text>
  <text x="1169" y="352" text-anchor="middle" font-size="9.5" fill="#94a3b8">max → CLZ</text>
  <text x="1169" y="368" text-anchor="middle" font-size="9.5" fill="#94a3b8">shift · clamp</text>
  <text x="1169" y="392" text-anchor="middle" font-size="9" fill="#64748b">4-bit [-8,7]</text>
</svg>
