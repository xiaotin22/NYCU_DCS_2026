<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1057d8"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ff5a00"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8a20b8"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#138a22"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #111; }
      .title { font-size: 58px; font-weight: 700; } .h1 { font-size: 34px; font-weight: 700; }
      .box { font-size: 26px; font-weight: 700; } .sub { font-size: 17px; fill: #555; }
      .small { font-size: 15px; fill: #555; } .label { font-size: 17px; font-weight: 700; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="900" y="62" text-anchor="middle" class="title">CA.sv Current Overall Architecture</text>
  <rect x="25" y="90" width="1450" height="805" rx="20" fill="white" stroke="#111" stroke-width="4"/>
  <text x="750" y="128" text-anchor="middle" class="h1">CA Top</text>
  <rect x="1530" y="160" width="170" height="630" rx="16" fill="#f7f7f7" stroke="#111" stroke-width="4"/>
  <text x="1615" y="455" text-anchor="middle" class="h1"><tspan x="1615">External</tspan><tspan x="1615" dy="44">RAM</tspan></text>
  <rect x="115" y="130" width="310" height="145" rx="12" fill="#fff4dc" stroke="#6b320f" stroke-width="3"/>
  <text x="270" y="178" text-anchor="middle" class="box">CA_Control</text>
  <text x="270" y="213" text-anchor="middle" class="sub"><tspan x="270">FSM: IDLE / FAST / ATT</tspan><tspan x="270" dy="22">Param capture: WQ / WK / WV</tspan><tspan x="270" dy="22">BURST_128 read &amp; write</tspan></text>
  <rect x="475" y="135" width="430" height="100" rx="12" fill="#fffdf8" stroke="#ff5a00" stroke-width="3"/>
  <text x="690" y="165" text-anchor="middle" class="label" fill="#ff5a00">Control/DataPath Contract</text>
  <text x="500" y="198" class="sub">Issue modes: IM_NORM / IM_ATT</text><text x="500" y="222" class="sub">128-word control; hidden pipeline depth</text>
  <rect x="930" y="130" width="380" height="120" rx="10" fill="#fbfbfb" stroke="#555" stroke-width="2"/>
  <text x="1120" y="160" text-anchor="middle" class="label">Final Metrics</text>
  <text x="955" y="192" class="sub">clk = 3.3 ns, latency = 9493 cycles</text><text x="955" y="217" class="sub">area = 11,599,150.327094</text><text x="955" y="242" class="sub">performance = 3.63e+11</text>
  <rect x="80" y="330" width="1320" height="500" rx="16" fill="#edf7ff" stroke="#083d9b" stroke-width="4"/><text x="740" y="370" text-anchor="middle" class="h1">CA_DataPath</text>
  <rect x="125" y="455" width="190" height="95" rx="12" fill="white" stroke="#083d9b" stroke-width="3"/><text x="220" y="493" text-anchor="middle" class="box">Input Reg</text><text x="220" y="520" text-anchor="middle" class="small"><tspan x="220">issue_valid/mode</tspan><tspan x="220" dy="18">rd_data_cs</tspan></text>
  <rect x="355" y="380" width="655" height="275" rx="14" fill="#faf1ff" stroke="#7b1fa2" stroke-width="4"/><text x="682" y="420" text-anchor="middle" class="h1" fill="#8a20b8">ATT_Stream_Core</text>
  <rect x="390" y="455" width="210" height="120" rx="12" fill="white" stroke="#8a20b8" stroke-width="3"/><text x="495" y="490" text-anchor="middle" class="label">QKV Proj + Quant</text><text x="495" y="520" text-anchor="middle" class="small"><tspan x="495">Q pipe reused for NORM</tspan><tspan x="495" dy="18">Q/K/V parallel pipes</tspan><tspan x="495" dy="18">local PoT + clamp to s4</tspan></text>
  <rect x="650" y="455" width="155" height="120" rx="12" fill="white" stroke="#8a20b8" stroke-width="3"/><text x="727" y="493" text-anchor="middle" class="box"><tspan x="727">Score</tspan><tspan x="727" dy="30">8-Tap</tspan></text><text x="727" y="543" text-anchor="middle" class="small"><tspan x="727">score0 / score1</tspan><tspan x="727" dy="18">activation folded</tspan></text>
  <rect x="850" y="455" width="125" height="120" rx="12" fill="white" stroke="#8a20b8" stroke-width="3"/><text x="912" y="493" text-anchor="middle" class="box"><tspan x="912">Final</tspan><tspan x="912" dy="30">Booth</tspan></text><text x="912" y="543" text-anchor="middle" class="small"><tspan x="912">score x V</tspan><tspan x="912" dy="18">64 lanes</tspan></text>
  <rect x="1055" y="455" width="170" height="120" rx="12" fill="#fff7dc" stroke="#c77a00" stroke-width="3"/><text x="1140" y="493" text-anchor="middle" class="box"><tspan x="1140">ACT</tspan><tspan x="1140" dy="30">5-Stage</tspan></text><text x="1140" y="543" text-anchor="middle" class="small"><tspan x="1140">ReLU / RAT</tspan><tspan x="1140" dy="18">CAT / BAT</tspan></text>
  <rect x="1260" y="425" width="120" height="150" rx="12" fill="#e9fff7" stroke="#007a3d" stroke-width="3"/><text x="1320" y="482" text-anchor="middle" class="box"><tspan x="1320">PoT</tspan><tspan x="1320" dy="30">5-Stage</tspan></text>
  <rect x="1248" y="595" width="145" height="72" rx="12" fill="#f6fffb" stroke="#007a3d" stroke-width="3"/><text x="1320" y="620" text-anchor="middle" class="label"><tspan x="1320">Matrix_Max</tspan><tspan x="1320" dy="20">3-Stage</tspan></text><text x="1320" y="654" text-anchor="middle" class="small">OR-reduce / shift</text>
  <rect x="1065" y="690" width="305" height="78" rx="12" fill="white" stroke="#138a22" stroke-width="3"/><text x="1218" y="722" text-anchor="middle" class="box">Write / Output Align</text><text x="1218" y="752" text-anchor="middle" class="small">wr_data skid buffer + out_valid/out_data</text>
  <path d="M1530 455 L1450 455 L1450 315 L220 315 L220 455" stroke="#1057d8" stroke-width="5" fill="none" marker-end="url(#arrow-blue)"/><text x="835" y="300" text-anchor="middle" class="label" fill="#1057d8">rd_data[255:0]</text>
  <line x1="315" y1="503" x2="390" y2="503" stroke="#1057d8" stroke-width="5" marker-end="url(#arrow-blue)"/><line x1="600" y1="503" x2="650" y2="503" stroke="#8a20b8" stroke-width="5" marker-end="url(#arrow-purple)"/><line x1="805" y1="503" x2="850" y2="503" stroke="#8a20b8" stroke-width="5" marker-end="url(#arrow-purple)"/><line x1="975" y1="503" x2="1055" y2="503" stroke="#8a20b8" stroke-width="5" marker-end="url(#arrow-purple)"/><line x1="1225" y1="503" x2="1260" y2="503" stroke="#1057d8" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <line x1="1320" y1="575" x2="1315" y2="595" stroke="#1057d8" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="1320" y1="575" x2="1215" y2="690" stroke="#138a22" stroke-width="5" marker-end="url(#arrow-green)"/><line x1="1370" y1="728" x2="1530" y2="640" stroke="#138a22" stroke-width="5" marker-end="url(#arrow-green)"/><line x1="1210" y1="768" x2="1210" y2="870" stroke="#138a22" stroke-width="5" marker-end="url(#arrow-green)"/>
  <path d="M515 575 L515 620 L1040 620 L1040 545 L1055 545" stroke="#1057d8" stroke-width="4" fill="none" marker-end="url(#arrow-blue)"/><text x="790" y="612" text-anchor="middle" class="small" fill="#1057d8">IM_NORM: FFN / Conv result</text>
  <path d="M425 210 L455 210 L455 285 L1530 285" stroke="#ff5a00" stroke-width="5" fill="none" marker-end="url(#arrow-orange)"/><text x="995" y="270" text-anchor="middle" class="label" fill="#ff5a00">RAM cmd: rd_en/wr_en, addr, burst</text>
  <line x1="270" y1="275" x2="270" y2="455" stroke="#ff5a00" stroke-width="5" marker-end="url(#arrow-orange)"/><text x="270" y="376" text-anchor="middle" class="label" fill="#ff5a00">issue_valid / issue_mode</text>
  <path d="M690 330 L590 300 L425 250" stroke="#ff5a00" stroke-width="4" fill="none" marker-end="url(#arrow-orange)"/><text x="555" y="290" text-anchor="middle" class="label" fill="#ff5a00">result_pre_valid / result_valid</text>
  <rect x="300" y="915" width="1200" height="60" rx="10" fill="white" stroke="#111" stroke-width="3"/>
  <text x="420" y="952" class="label" fill="#1057d8">blue = data flow</text><text x="705" y="952" class="label" fill="#ff5a00">orange = control/status</text><text x="990" y="952" class="label" fill="#8a20b8">purple = attention stream</text><text x="1275" y="952" class="label" fill="#138a22">green = write/output</text>
</svg>
